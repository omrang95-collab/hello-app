<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="عقارات" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>عقارات للإيجار</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #111111;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --soft: #f1f1f3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body.modal-open { overflow: hidden; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.5px;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(140px, 1fr) repeat(2, minmax(110px, .7fr));
      gap: 9px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      min-height: 44px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus {
      border-color: #aaa;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 38px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .property-card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 22px rgba(0,0,0,.055);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .property-card:active {
      transform: scale(.992);
    }

    .property-image {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #ddd;
    }

    .property-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .availability {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .content {
      padding: 15px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .title {
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .location {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .tag {
      padding: 7px 10px;
      background: var(--soft);
      border-radius: 999px;
      font-size: 12px;
    }

    .view {
      margin-top: 14px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      min-height: 44px;
    }

    .empty {
      display: none;
      background: #fff;
      border-radius: 18px;
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0,0,0,.45);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
    }

    .modal-image {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      background: #ddd;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .close {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body { padding: 20px; }

    .modal-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 25px;
    }

    .modal-price {
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    .modal-description {
      color: #444;
      line-height: 1.85;
      margin: 18px 0;
    }

    .details-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .detail-box {
      background: var(--soft);
      border-radius: 13px;
      padding: 12px;
    }

    .detail-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .detail-box strong {
      font-size: 15px;
    }

    .contact {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 13px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
    }

    footer {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 0 16px 25px;
    }

    @media (max-width: 700px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filters .search {
        grid-column: 1 / -1;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .brand {
        align-items: flex-start;
      }

      .modal {
        align-items: flex-end;
        padding: 0;
      }

      .modal-card {
        max-height: 94vh;
        border-radius: 24px 24px 0 0;
      }

      .modal-image {
        border-radius: 24px 24px 0 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div>
          <h1>عقارات للإيجار</h1>
          <p>ابحث عن العقار المناسب لك</p>
        </div>
        <div class="count" id="count"></div>
      </div>

      <div class="filters">
        <input class="search" id="search" type="search" placeholder="ابحث بالاسم أو المنطقة..." />
        <select id="location">
          <option value="">كل المناطق</option>
        </select>
        <input id="minPrice" type="number" inputmode="numeric" min="0" placeholder="أقل سعر" />
        <input id="maxPrice" type="number" inputmode="numeric" min="0" placeholder="أعلى سعر" />
      </div>
    </div>
  </header>

  <main>
    <section id="grid" class="grid"></section>
    <div id="empty" class="empty">لا توجد عقارات مطابقة للبحث.</div>
  </main>

  <footer>نسخة تجريبية v0.3</footer>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-image">
        <img id="modalImg" src="" alt="" />
        <button class="close" id="closeBtn" aria-label="إغلاق">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-title-row">
          <div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="location" id="modalLocation"></div>
          </div>
          <div class="modal-price" id="modalPrice"></div>
        </div>

        <div class="features" id="modalFeatures"></div>
        <p class="modal-description" id="modalDescription"></p>

        <div class="details-list">
          <div class="detail-box"><span>نوع العقار</span><strong id="dType"></strong></div>
          <div class="detail-box"><span>التأثيث</span><strong id="dFurnished"></strong></div>
          <div class="detail-box"><span>مدة العقد</span><strong id="dContract"></strong></div>
          <div class="detail-box"><span>الحالة</span><strong id="dStatus"></strong></div>
        </div>

        <button class="contact" onclick="alert('سنضيف التواصل والحجز في النسخة القادمة')">تواصل بخصوص العقار</button>
      </div>
    </div>
  </div>

  <script>
    const properties = [
      {
        id: 1,
        title: "شقة عائلية حديثة",
        location: "المعبيلة",
        city: "مسقط",
        price: 300,
        rooms: 3,
        baths: 2,
        area: 120,
        extra: "موقف سيارة",
        type: "شقة",
        furnished: "غير مفروش",
        contract: "سنة",
        status: "متاح الآن",
        description: "شقة مرتبة ومناسبة للعائلة في موقع هادئ وقريب من الخدمات والمدارس والمحلات.",
        image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=85"
      },
      {
        id: 2,
        title: "فيلا مستقلة",
        location: "الخوض",
        city: "مسقط",
        price: 450,
        rooms: 4,
        baths: 4,
        area: 260,
        extra: "حوش خاص",
        type: "فيلا",
        furnished: "غير مفروش",
        contract: "سنة",
        status: "متاح الآن",
        description: "فيلا واسعة مناسبة للعائلة مع مساحة خارجية ومواقف خاصة وقريبة من الخدمات الرئيسية.",
        image: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1400&q=85"
      },
      {
        id: 3,
        title: "شقة مفروشة",
        location: "بوشر",
        city: "مسقط",
        price: 380,
        rooms: 2,
        baths: 2,
        area: 95,
        extra: "مفروشة",
        type: "شقة",
        furnished: "مفروش",
        contract: "6 أشهر أو سنة",
        status: "متاح",
        description: "شقة مفروشة بتصميم حديث، مناسبة للموظفين أو الأزواج، وفي موقع قريب من الطرق الرئيسية.",
        image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1400&q=85"
      }
    ];

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const search = document.getElementById("search");
    const locationFilter = document.getElementById("location");
    const minPrice = document.getElementById("minPrice");
    const maxPrice = document.getElementById("maxPrice");

    [...new Set(properties.map(p => p.location))].sort().forEach(location => {
      const opt = document.createElement("option");
      opt.value = location;
      opt.textContent = location;
      locationFilter.appendChild(opt);
    });

    function card(p) {
      return `
        <article class="property-card" onclick="openProperty(${p.id})">
          <div class="property-image">
            <img src="${p.image}" alt="${p.title}" loading="lazy">
            <div class="availability">${p.status}</div>
          </div>
          <div class="content">
            <div class="topline">
              <div>
                <h2 class="title">${p.title}</h2>
                <div class="location">${p.location}، ${p.city}</div>
              </div>
              <div class="price">${p.price} ر.ع</div>
            </div>
            <div class="features">
              <span class="tag">${p.rooms} غرف</span>
              <span class="tag">${p.baths} حمام</span>
              <span class="tag">${p.area} م²</span>
              <span class="tag">${p.extra}</span>
            </div>
            <button class="view">عرض التفاصيل</button>
          </div>
        </article>
      `;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const loc = locationFilter.value;
      const min = minPrice.value === "" ? 0 : Number(minPrice.value);
      const max = maxPrice.value === "" ? Infinity : Number(maxPrice.value);

      const filtered = properties.filter(p => {
        const haystack = `${p.title} ${p.location} ${p.city} ${p.type}`.toLowerCase();
        return haystack.includes(q)
          && (!loc || p.location === loc)
          && p.price >= min
          && p.price <= max;
      });

      grid.innerHTML = filtered.map(card).join("");
      count.textContent = `${filtered.length} عقار`;
      empty.style.display = filtered.length ? "none" : "block";
    }

    [search, locationFilter, minPrice, maxPrice].forEach(el => {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });

    const modal = document.getElementById("modal");
    const closeBtn = document.getElementById("closeBtn");

    function openProperty(id) {
      const p = properties.find(x => x.id === id);
      if (!p) return;

      document.getElementById("modalImg").src = p.image;
      document.getElementById("modalImg").alt = p.title;
      document.getElementById("modalTitle").textContent = p.title;
      document.getElementById("modalLocation").textContent = `${p.location}، ${p.city}`;
      document.getElementById("modalPrice").textContent = `${p.price} ر.ع / شهر`;
      document.getElementById("modalDescription").textContent = p.description;
      document.getElementById("modalFeatures").innerHTML = `
        <span class="tag">${p.rooms} غرف</span>
        <span class="tag">${p.baths} حمام</span>
        <span class="tag">${p.area} م²</span>
        <span class="tag">${p.extra}</span>
      `;
      document.getElementById("dType").textContent = p.type;
      document.getElementById("dFurnished").textContent = p.furnished;
      document.getElementById("dContract").textContent = p.contract;
      document.getElementById("dStatus").textContent = p.status;

      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      history.replaceState(null, "", `#property-${id}`);
    }

    function closeModal() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      history.replaceState(null, "", location.pathname + location.search);
    }

    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    render();

    const match = location.hash.match(/^#property-(\d+)$/);
    if (match) openProperty(Number(match[1]));
  </script>
</body>
</html>
