<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="عقارات">
  <link rel="manifest" href="manifest.webmanifest">
  <title>عقارات للإيجار</title>
  <style>
    :root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6e6e73;--border:#e5e5ea;--soft:#f1f1f3}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border)}
    .wrap{max-width:980px;margin:auto;padding:16px}.brand{display:flex;justify-content:space-between;gap:12px;align-items:end}
    h1{margin:0;font-size:28px}.muted{color:var(--muted)} .small{font-size:13px}
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
    input,select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:0 12px;font-size:15px}
    main{max-width:980px;margin:auto;padding:18px 16px 40px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 22px rgba(0,0,0,.055)}
    .img{aspect-ratio:16/10;background:#ddd}.img img{width:100%;height:100%;object-fit:cover;display:block}
    .body{padding:15px}.row{display:flex;justify-content:space-between;gap:12px}.title{margin:0;font-size:19px}.price{font-weight:800;white-space:nowrap}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.tag{background:var(--soft);border-radius:999px;padding:7px 10px;font-size:12px}
    .btn{width:100%;min-height:44px;border:0;border-radius:12px;background:#111;color:#fff;font-size:15px;font-weight:700;margin-top:14px}
    .empty,.notice{background:#fff;border-radius:18px;padding:24px;text-align:center;color:var(--muted)}
    .notice{margin-bottom:18px}.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);padding:20px;align-items:center;justify-content:center}
    .modal.show{display:flex}.modal-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px}
    .modal-img{position:relative;aspect-ratio:16/9}.modal-img img{width:100%;height:100%;object-fit:cover;border-radius:24px 24px 0 0}
    .close{position:absolute;top:12px;left:12px;width:38px;height:38px;border:0;border-radius:50%;font-size:20px;background:rgba(255,255,255,.92)}
    .modal-body{padding:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
    .box{background:var(--soft);padding:12px;border-radius:13px}.box span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.modal{padding:0;align-items:flex-end}.modal-card{border-radius:24px 24px 0 0}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div><h1>عقارات للإيجار</h1><div class="muted small">ابحث عن العقار المناسب لك</div></div>
      <div id="count" class="muted small"></div>
    </div>
    <div class="filters">
      <input id="search" class="search" type="search" placeholder="ابحث بالاسم أو المنطقة">
      <select id="location"><option value="">كل المناطق</option></select>
      <input id="minPrice" type="number" placeholder="أقل سعر">
      <input id="maxPrice" type="number" placeholder="أعلى سعر">
    </div>
  </div>
</header>

<main>
  <div id="notice" class="notice" style="display:none"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">لا توجد عقارات مطابقة.</div>
</main>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-img">
      <img id="mImg" alt="">
      <button id="close" class="close">×</button>
    </div>
    <div class="modal-body">
      <div class="row">
        <div><h2 id="mTitle" style="margin:0"></h2><div id="mLocation" class="muted"></div></div>
        <div id="mPrice" class="price"></div>
      </div>
      <div id="mTags" class="tags"></div>
      <p id="mDescription" style="line-height:1.8;color:#444"></p>
      <div class="details">
        <div class="box"><span>نوع العقار</span><strong id="mType"></strong></div>
        <div class="box"><span>التأثيث</span><strong id="mFurnished"></strong></div>
        <div class="box"><span>مدة العقد</span><strong id="mContract"></strong></div>
        <div class="box"><span>الحالة</span><strong id="mStatus"></strong></div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const demo = [
    {id:1,title:"شقة عائلية حديثة",location:"المعبيلة",city:"مسقط",price:300,rooms:3,baths:2,area:120,extra:"موقف سيارة",type:"شقة",furnished:"غير مفروش",contract:"سنة",status:"متاح الآن",description:"شقة مرتبة ومناسبة للعائلة وقريبة من الخدمات.",image_url:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=85"},
    {id:2,title:"فيلا مستقلة",location:"الخوض",city:"مسقط",price:450,rooms:4,baths:4,area:260,extra:"حوش خاص",type:"فيلا",furnished:"غير مفروش",contract:"سنة",status:"متاح الآن",description:"فيلا واسعة مناسبة للعائلة مع مساحة خارجية.",image_url:"https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1400&q=85"}
  ];

  const cfg = window.APP_CONFIG || {};
  const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes("YOUR_") &&
                     cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes("YOUR_");
  const supabase = configured ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

  let properties = [];
  const els = Object.fromEntries(["grid","empty","notice","count","search","location","minPrice","maxPrice","modal","close"].map(id=>[id,document.getElementById(id)]));

  async function loadProperties(){
    if (!supabase){
      properties = demo;
      els.notice.style.display = "block";
      els.notice.textContent = "وضع تجريبي: اربط Supabase في config.js لعرض العقارات من قاعدة البيانات.";
      setupLocations(); render(); return;
    }
    const { data, error } = await supabase.from("properties").select("*").eq("published", true).order("created_at",{ascending:false});
    if (error){
      els.notice.style.display = "block";
      els.notice.textContent = "تعذر تحميل قاعدة البيانات. تحقق من إعداد Supabase.";
      properties = [];
    } else {
      properties = data || [];
    }
    setupLocations(); render();
  }

  function setupLocations(){
    const current = els.location.value;
    els.location.innerHTML='<option value="">كل المناطق</option>';
    [...new Set(properties.map(p=>p.location).filter(Boolean))].sort().forEach(v=>{
      const o=document.createElement("option");o.value=v;o.textContent=v;els.location.appendChild(o);
    });
    els.location.value=current;
  }

  function render(){
    const q=els.search.value.trim().toLowerCase(), loc=els.location.value;
    const min=els.minPrice.value===""?0:Number(els.minPrice.value), max=els.maxPrice.value===""?Infinity:Number(els.maxPrice.value);
    const list=properties.filter(p=>{
      const h=`${p.title||""} ${p.location||""} ${p.city||""} ${p.type||""}`.toLowerCase();
      return h.includes(q)&&(!loc||p.location===loc)&&Number(p.price)>=min&&Number(p.price)<=max;
    });
    els.count.textContent=`${list.length} عقار`;
    els.empty.style.display=list.length?"none":"block";
    els.grid.innerHTML=list.map(p=>`
      <article class="card">
        <div class="img"><img loading="lazy" src="${escapeAttr(p.image_url||"")}" alt="${escapeAttr(p.title||"عقار")}"></div>
        <div class="body">
          <div class="row">
            <div><h2 class="title">${safe(p.title)}</h2><div class="muted small">${safe(p.location)}${p.city?"، "+safe(p.city):""}</div></div>
            <div class="price">${Number(p.price||0)} ر.ع</div>
          </div>
          <div class="tags">
            <span class="tag">${Number(p.rooms||0)} غرف</span><span class="tag">${Number(p.baths||0)} حمام</span>
            <span class="tag">${Number(p.area||0)} م²</span>${p.extra?`<span class="tag">${safe(p.extra)}</span>`:""}
          </div>
          <button class="btn" data-id="${p.id}">عرض التفاصيل</button>
        </div>
      </article>`).join("");
    document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",()=>openProperty(b.dataset.id)));
  }

  function safe(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
  function escapeAttr(v){return String(v??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

  function openProperty(id){
    const p=properties.find(x=>String(x.id)===String(id)); if(!p)return;
    document.getElementById("mImg").src=p.image_url||"";
    document.getElementById("mTitle").textContent=p.title||"";
    document.getElementById("mLocation").textContent=[p.location,p.city].filter(Boolean).join("، ");
    document.getElementById("mPrice").textContent=`${Number(p.price||0)} ر.ع / شهر`;
    document.getElementById("mTags").innerHTML=`<span class="tag">${Number(p.rooms||0)} غرف</span><span class="tag">${Number(p.baths||0)} حمام</span><span class="tag">${Number(p.area||0)} م²</span>`;
    document.getElementById("mDescription").textContent=p.description||"";
    document.getElementById("mType").textContent=p.type||"—";
    document.getElementById("mFurnished").textContent=p.furnished||"—";
    document.getElementById("mContract").textContent=p.contract||"—";
    document.getElementById("mStatus").textContent=p.status||"—";
    els.modal.classList.add("show");
  }
  els.close.onclick=()=>els.modal.classList.remove("show");
  els.modal.onclick=e=>{if(e.target===els.modal)els.modal.classList.remove("show")};
  [els.search,els.location,els.minPrice,els.maxPrice].forEach(e=>{e.addEventListener("input",render);e.addEventListener("change",render)});
  loadProperties();
</script>
</body>
</html>
